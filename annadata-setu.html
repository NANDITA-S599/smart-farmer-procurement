<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kisanmandi — Procurement Centre Queue &amp; Payment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Kannada:wght@400;500;700&family=Noto+Sans+Gurmukhi:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E8EBE1; --surface:#FFFFFF; --surface-2:#F3F5EE; --sunk:#DDE2D4;
  --ink:#17211B; --muted:#5C6B5F; --line:#CBD3C1;
  --green:#1B5E3A; --green-2:#25764A; --turmeric:#D98324; --turmeric-soft:#FBEBD6;
  --ok:#1B7A44; --ok-soft:#DFF0E4; --warn:#9A6207; --warn-soft:#FBEED2;
  --bad:#A32B20; --bad-soft:#F7DFDC; --board:#12241A; --board-text:#F2C14E;
  --r-card:14px; --r-pill:999px;
  --shadow:0 1px 2px rgba(23,33,27,.08), 0 8px 24px -14px rgba(23,33,27,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#111A14; --surface:#18231C; --surface-2:#1E2B23; --sunk:#0D150F;
    --ink:#E8EEE6; --muted:#9AAB9E; --line:#2C3C32;
    --green:#5FBF8A; --green-2:#7FD3A3; --turmeric:#E8A24E; --turmeric-soft:#3A2A14;
    --ok:#69C48F; --ok-soft:#16301F; --warn:#E0B357; --warn-soft:#33270D;
    --bad:#E9897C; --bad-soft:#3A1C18; --board:#0A140E; --board-text:#F2C14E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --page:#111A14; --surface:#18231C; --surface-2:#1E2B23; --sunk:#0D150F;
  --ink:#E8EEE6; --muted:#9AAB9E; --line:#2C3C32;
  --green:#5FBF8A; --green-2:#7FD3A3; --turmeric:#E8A24E; --turmeric-soft:#3A2A14;
  --ok:#69C48F; --ok-soft:#16301F; --warn:#E0B357; --warn-soft:#33270D;
  --bad:#E9897C; --bad-soft:#3A1C18; --board:#0A140E; --board-text:#F2C14E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink); font-family:"Noto Sans","Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Gurmukhi",system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"Noto Sans",system-ui,sans-serif; line-height:1.15; margin:0; letter-spacing:-.015em; font-weight:700}
h1{font-size:clamp(28px,5vw,44px)} h2{font-size:clamp(20px,3vw,26px)} h3{font-size:18px} h4{font-size:15px}
p{margin:0 0 .7em} a{color:var(--green)}
:lang(hi) h1,:lang(kn) h1,:lang(pa) h1,:lang(mr) h1,
:lang(hi) h2,:lang(kn) h2,:lang(pa) h2,:lang(mr) h2{font-family:"Noto Sans Devanagari","Noto Sans Kannada","Noto Sans Gurmukhi","Noto Sans",sans-serif;letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--turmeric); outline-offset:2px; border-radius:4px}
.mono{font-family:"Roboto Mono",ui-monospace,monospace}

/* layout */
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
.narrow{max-width:760px;margin:0 auto;padding:0 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:14px}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.stack>*+*{margin-top:14px}
.hide-sm{display:none}
@media(min-width:840px){.hide-sm{display:block}}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 18px;max-width:1140px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:Archivo;font-weight:700;font-size:17px;letter-spacing:-.02em}
.seal{width:32px;height:32px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.brand small{display:block;font-family:"Noto Sans";font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}

/* controls */
.btn{border:1px solid var(--green);background:var(--green);color:#fff;padding:10px 16px;border-radius:var(--r-pill);font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{background:var(--green-2);border-color:var(--green-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.warn{background:var(--turmeric);border-color:var(--turmeric);color:#231403}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.block{width:100%;justify-content:center}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.input,select.input,textarea.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
.input:focus{border-color:var(--green)}
select.lang{padding:7px 10px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:500}
.icon-btn{border:1px solid var(--line);background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:15px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.sunk{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.tag{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.info{background:var(--turmeric-soft);color:var(--warn);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}

/* queue board — the hero */
.board{background:var(--board);border-radius:16px;padding:22px;color:#EFF3EA;position:relative;overflow:hidden}
.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.board-label{font-size:12.5px;color:#9DB3A4;font-weight:600;margin-bottom:2px}
.board-num{font-family:"Roboto Mono";font-weight:700;font-size:clamp(40px,10vw,76px);color:var(--board-text);line-height:1;letter-spacing:.02em;text-shadow:0 0 22px rgba(242,193,78,.25)}
.board-grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:680px){.board-grid{grid-template-columns:1.2fr 1fr}}
.board-mini{display:flex;gap:18px;flex-wrap:wrap}
.board-mini div b{display:block;font-family:"Roboto Mono";font-size:22px;color:#EFF3EA}
.board-mini div span{font-size:12px;color:#9DB3A4}

/* token slip */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.slip:after,.slip:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--page);top:50%;transform:translateY(-50%);border:1px solid var(--line)}
.slip:before{left:-9px;border-right-color:transparent;clip-path:inset(0 0 0 50%)}
.slip:after{right:-9px;border-left-color:transparent;clip-path:inset(0 50% 0 0)}
.slip .tok{font-family:"Roboto Mono";font-weight:700;font-size:26px;letter-spacing:.04em}

/* progress / bars */
.bar{height:9px;background:var(--sunk);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:var(--r-pill);transition:width .5s ease}
.bar i.hot{background:var(--bad)} .bar i.mid{background:var(--turmeric)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 15px;border-radius:var(--r-pill);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--green);color:#fff}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* steps */
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{flex:1;min-width:96px;padding:9px 6px;border-top:4px solid var(--sunk);font-size:12.5px;color:var(--muted)}
.step.done{border-top-color:var(--green);color:var(--ink);font-weight:600}
.step.now{border-top-color:var(--turmeric);color:var(--ink);font-weight:700}

/* sms */
.sms{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:0 10px 10px 0;padding:11px 13px}
.sms.unread{border-left-color:var(--turmeric);background:var(--turmeric-soft)}

/* misc */
.notice{background:var(--turmeric-soft);border:1px solid color-mix(in srgb,var(--turmeric) 40%,transparent);border-radius:10px;padding:11px 13px;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--board);color:#fff;padding:12px 20px;border-radius:var(--r-pill);z-index:99;box-shadow:var(--shadow);font-weight:600;font-size:14.5px;max-width:92vw;text-align:center}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;cursor:pointer;text-align:left;width:100%}
.slot[aria-pressed="true"]{border-color:var(--green);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--green)}
.slot:disabled{opacity:.5;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.cipher{font-family:"Roboto Mono";font-size:11.5px;word-break:break-all;color:var(--muted);background:var(--sunk);padding:8px;border-radius:8px;max-height:96px;overflow:auto}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--turmeric);display:inline-block;animation:p 1.8s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.footer{padding:26px 0;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:34px}
</style>
</head>

/* ============================================================
   2. ENCRYPTION LAYER  (Web Crypto API)
   PIN  -> PBKDF2-SHA256, 150k iterations, per-user random salt
   PII  -> AES-GCM 256, per-field random 96-bit IV
   ============================================================ */
const SC = window.crypto && window.crypto.subtle;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const randHex = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,"0")).join("");

const KDF_ITER = 150000;

async function hashPin(pin, saltHex){
  const salt = saltHex || randHex(16);
  const base = await SC.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await SC.deriveBits({name:"PBKDF2", salt:enc.encode(salt), iterations:KDF_ITER, hash:"SHA-256"}, base, 256);
  return {salt, hash:b64(bits)};
}
async function verifyPin(pin, saltHex, expected){
  const {hash} = await hashPin(pin, saltHex);
  // constant-time-ish compare
  if(hash.length !== expected.length) return false;
  let diff = 0;
  for(let i=0;i<hash.length;i++) diff |= hash.charCodeAt(i) ^ expected.charCodeAt(i);
  return diff === 0;
}

let AES_KEY = null;
async function initKey(){
  let keySalt = null;
  try{ keySalt = localStorage.getItem("as.keysalt"); }catch(e){}
  if(!keySalt){ keySalt = randHex(16); try{ localStorage.setItem("as.keysalt", keySalt); }catch(e){} }
  // In production this master secret lives in a KMS / HSM on the server, never in the client.
  const base = await SC.importKey("raw", enc.encode("annadata-setu::field-encryption::v1"), "PBKDF2", false, ["deriveKey"]);
  AES_KEY = await SC.deriveKey(
    {name:"PBKDF2", salt:enc.encode(keySalt), iterations:KDF_ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function encField(plain){
  if(plain === undefined || plain === null || plain === "") return "";
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await SC.encrypt({name:"AES-GCM", iv}, AES_KEY, enc.encode(String(plain)));
  return b64(iv) + ":" + b64(ct);
}
async function decField(blob){
  if(!blob) return "";
  try{
    const [ivS, ctS] = blob.split(":");
    const pt = await SC.decrypt({name:"AES-GCM", iv:unb64(ivS)}, AES_KEY, unb64(ctS));
    return dec.decode(pt);
  }catch(e){ return "—"; }
}
const maskTail = (s,n=4) => s ? "•".repeat(Math.max(0,s.length-n)) + s.slice(-n) : "";

function servingToken(db, centreId, date){ return db.serving[centreId+"|"+date] || null; }
function slotCount(db, centreId, date, slot){
  return db.bookings.filter(b=>b.centreId===centreId && b.date===date && b.slot===slot && b.status!=="cancelled").length;
}
function positionOf(db, booking){
  const q = queueFor(db, booking.centreId, booking.date);
  return q.findIndex(b=>b.id===booking.id);
}
function storagePct(c){ return Math.min(100, Math.round((c.storageUsed/c.storageCap)*100)); }

function pushNote(db, farmerId, text, channel){
  db.notes.unshift({id:uid("n"), farmerId, text, channel:channel||"sms", ts:Date.now(), read:false});
  if(db.notes.length>400) db.notes.length = 400;
}

  };
  const [cls,key] = map[status] || ["","booked"];
  return <span className={"tag "+cls}>{t(key)}</span>;
}

function StatusTrail({status,t}){
  const order = ["booked","arrived","weighed","accepted","paid"];
  const labels = {booked:"statusBooked",arrived:"statusArrived",weighed:"statusWeighed",accepted:"statusAccepted",paid:"statusPaid"};
  const cur = order.indexOf(status);
  return (
    <div className="steps">

        <div key={s} className={"step "+(i<cur?"done":i===cur?"now":"")}>{t(labels[s])}</div>
      ))}
    </div>
  );
}

   ============================================================ */
function FarmerAuth({db,setDB,t,lang,setLang,onLogin,go}){
  const [mode,setMode] = useState("login");
  const [err,setErr] = useState("");
  const [busy,setBusy] = useState(false);
  const [f,setF] = useState({phone:"",pin:"",pin2:"",name:"",village:"",crop:"Paddy",acres:"",aadhaar:"",bank:""});
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  async function doLogin(){
    setErr("");
    if(!/^\d{10}$/.test(f.phone)) return setErr(t("errPhone"));
    if(!/^\d{4}$/.test(f.pin)) return setErr(t("errPin"));
    setBusy(true);
    let found = null;
    for(const fr of db.farmers){
      const ph = await decField(fr.phoneEnc);
      if(ph === f.phone){ found = fr; break; }
    }
    if(!found){ setBusy(false); return setErr(t("errNoUser")); }
    const ok = await verifyPin(f.pin, found.pinSalt, found.pinHash);
    setBusy(false);
    if(!ok) return setErr(t("errWrong"));
    if(found.lang) setLang(found.lang);
    onLogin(found.id);
  }

  async function doRegister(){
    setErr("");
    if(!f.name.trim()) return setErr(t("errName"));
    if(!/^\d{10}$/.test(f.phone)) return setErr(t("errPhone"));
    if(!/^\d{4}$/.test(f.pin)) return setErr(t("errPin"));
    if(f.pin !== f.pin2) return setErr(t("errPinMatch"));
    setBusy(true);
    for(const fr of db.farmers){
      if(await decField(fr.phoneEnc) === f.phone){ setBusy(false); return setErr(t("errExists")); }
    }
    const {salt,hash} = await hashPin(f.pin);
    const rec = {
      id:uid("f"), name:f.name.trim(), village:f.village.trim(), crop:f.crop, acres:f.acres, lang,
      phoneEnc: await encField(f.phone), phoneMask: maskTail(f.phone,4),
      aadhaarEnc: await encField(f.aadhaar), aadhaarMask: maskTail(f.aadhaar,4),
      bankEnc: await encField(f.bank), bankMask: maskTail(f.bank,4),
      pinSalt:salt, pinHash:hash, createdAt:Date.now()
    };
    setDB(d=>{ const n={...d, farmers:[...d.farmers, rec]}; return n; });
    setBusy(false);
    onLogin(rec.id);
  }

  return (
    <div className="narrow" style={{paddingTop:26,maxWidth:520}}>
      <button className="btn ghost sm" onClick={()=>go("landing")}>← {t("back")}</button>
      <div className="card" style={{marginTop:14}}>
        <h2>{mode==="login"?t("farmerLogin"):t("farmerRegister")}</h2>
        <p className="small muted">{mode==="login" ? "Demo: 9845012301 · PIN 1111" : t("tagline")}</p>
        <hr className="sep"/>
        {mode==="register" && <>
          <label className="field"><span>{t("name")}</span>
            <input className="input" value={f.name} onChange={e=>set("name",e.target.value)} /></label>
          <div className="grid g2">
            <label className="field"><span>{t("village")}</span>
              <input className="input" value={f.village} onChange={e=>set("village",e.target.value)} /></label>
            <label className="field"><span>{t("crop")}</span>
              <select className="input" value={f.crop} onChange={e=>set("crop",e.target.value)}>
                <option>Paddy</option><option>Wheat</option><option>Ragi</option><option>Maize</option><option>Jowar</option>
              </select></label>
          </div>
        </>}
        <label className="field"><span>{t("phone")}</span>
          <input className="input mono" inputMode="numeric" maxLength={10} value={f.phone}
            onChange={e=>set("phone",e.target.value.replace(/\D/g,""))} placeholder="9876543210" /></label>
        {mode==="register" && <div className="grid g2">
          <label className="field"><span>{t("acres")}</span>
            <input className="input" inputMode="decimal" value={f.acres} onChange={e=>set("acres",e.target.value)} /></label>
          <label className="field"><span>{t("aadhaar")}</span>
            <input className="input mono" inputMode="numeric" maxLength={12} value={f.aadhaar}
              onChange={e=>set("aadhaar",e.target.value.replace(/\D/g,""))} /></label>
        </div>}
        {mode==="register" &&
          <label className="field"><span>{t("bank")}</span>
            <input className="input mono" value={f.bank} onChange={e=>set("bank",e.target.value)} /></label>}
        <div className="grid g2">
          <label className="field"><span>{t("pin")}</span>
            <input className="input mono" type="password" inputMode="numeric" maxLength={4} value={f.pin}
              onChange={e=>set("pin",e.target.value.replace(/\D/g,""))} /></label>
          {mode==="register" &&
            <label className="field"><span>{t("confirmPin")}</span>
              <input className="input mono" type="password" inputMode="numeric" maxLength={4} value={f.pin2}
                onChange={e=>set("pin2",e.target.value.replace(/\D/g,""))} /></label>}
        </div>
        {err && <div className="notice small" style={{marginBottom:12,borderColor:"var(--bad)",background:"var(--bad-soft)",color:"var(--bad)"}}>{err}</div>}
        <button className="btn block" disabled={busy} onClick={mode==="login"?doLogin:doRegister}>
          {busy ? "…" : (mode==="login"?t("login"):t("createAccount"))}
        </button>
        <p className="small" style={{textAlign:"center",marginTop:12,marginBottom:0}}>
          <a href="#" onClick={e=>{e.preventDefault();setErr("");setMode(mode==="login"?"register":"login");}}>
            {mode==="login"?t("newHere"):t("haveAccount")}
          </a>
        </p>
      </div>
    </div>
  );
}

const MIN_QTY = 1, MAX_QTY = 20;
function BookSlot({db,setDB,t,lang,me,toast,setTab}){
  const [cid,setCid] = useState(db.centres[0]?db.centres[0].id:"");
  const [date,setDate] = useState(todayISO());
  const [slot,setSlot] = useState("");
  const [qty,setQty] = useState("");
  const [err,setErr] = useState("");
  const c = centreById(db,cid);

  function confirm(){
    setErr("");
    if(!slot) return setErr(t("errSlot"));
    if(!qty) return setErr(t("errQty"));
    if(Number(qty) < MIN_QTY || Number(qty) > MAX_QTY) return setErr(t("errQtyRange"));
    if(slotCount(db,cid,date,slot) >= c.perSlot) return setErr(t("errFull"));
    setDB(d=>{
      const n = {...d, bookings:[...d.bookings], notes:[...d.notes], seq:{...d.seq}};
      const key = cid+"|"+date;
      const seq = (n.seq[key]||0)+1; n.seq[key]=seq;
      const dd = date.slice(8,10)+date.slice(5,7);
      const token = c.code+"-"+dd+"-"+String(seq).padStart(3,"0");
      const bk = {id:uid("b"), farmerId:me.id, centreId:cid, date, slot, seq, token,
        status:"booked", expQty:Number(qty), rate:c.rate, createdAt:Date.now()};
      n.bookings.push(bk);
      pushNote(n, me.id, makeT(me.lang||lang)("msgBooked",{c:c.name,d:fmtDate(date,me.lang||lang),t:slot,k:token}), "sms");
      return n;
    });
    toast(t("bookingDone"));
    setTab("home");
  }

  return (
    <div className="stack">
      <h2>{t("bookAt")}</h2>
      <div className="card">
        <label className="field"><span>{t("step1")}</span>
          <select className="input" value={cid} onChange={e=>{setCid(e.target.value);setSlot("");}}>
            {db.centres.map(x=><option key={x.id} value={x.id}>{x.name} — {x.crop}</option>)}
          </select></label>
        {c && <StorageBar c={c} t={t}/>}
      </div>
      <div className="card">
        <span className="small muted" style={{fontWeight:500}}>{t("step2")}</span>
        <div className="row" style={{marginTop:8,gap:8}}>
          {dayList().map(d=>(
            <button key={d} className="slot" style={{width:"auto",minWidth:76,textAlign:"center"}}
              aria-pressed={date===d} onClick={()=>{setDate(d);setSlot("");}}>
              <b>{fmtDate(d,lang)}</b>
            </button>
          ))}
        </div>
      </div>
      <div className="card">
        <span className="small muted" style={{fontWeight:500}}>{t("step3")}</span>
        <div className="grid g2" style={{marginTop:8}}>
          {TIME_SLOTS.map(s=>{
            const used = slotCount(db,cid,date,s), left = (c?c.perSlot:0)-used, full = left<=0;
            return (
              <button key={s} className="slot" aria-pressed={slot===s} disabled={full} onClick={()=>setSlot(s)}>
                <b className="mono">{s}</b>
                <div className="tiny muted">{full ? t("slotFull") : left+" "+t("slotsLeft")}</div>
                <div className="bar" style={{marginTop:6}}><i className={left<=2?"hot":left<=5?"mid":""} style={{width:(c?(used/c.perSlot*100):0)+"%"}}/></div>
              </button>
            );
          })}
        </div>
      </div>
      <div className="card">
        <label className="field"><span>{t("expectedQty")}</span>
          <input className="input mono" inputMode="decimal" value={qty} onChange={e=>setQty(e.target.value.replace(/[^\d.]/g,""))} placeholder="0"/></label>
        <p className="tiny muted" style={{marginTop:-6,marginBottom:12}}>{t("qtyHint")}</p>
        {err && <div className="notice small" style={{marginBottom:12,borderColor:"var(--bad)",background:"var(--bad-soft)",color:"var(--bad)"}}>{err}</div>}
        <button className="btn block" onClick={confirm}>{t("confirmBooking")}</button>
      </div>
    </div>
  );
}

function LiveQueue({db,setDB,t,lang,active,setTab,toast}){
  const [cid,setCid] = useState(active?active.centreId:(db.centres[0]?db.centres[0].id:""));
  const date = active?active.date:todayISO();
  const c = centreById(db,cid);
  const q = queueFor(db,cid,date);
  const serving = servingToken(db,cid,date);
  const pos = active && active.centreId===cid ? positionOf(db,active) : -1;
  const isCalled = serving && active && serving.id===active.id;

  function cancelBooking(){
    if(!window.confirm(t("confirmCancel"))) return;
    setDB(d=>({...d, bookings:d.bookings.map(b=>b.id===active.id?{...b,status:"cancelled"}:b)}));
    toast(t("cancelled"));
    setTab("home");

  return (
    <div className="stack">
      <div className="between">
        <h2>{t("liveBoard")}</h2>
        <select className="lang" value={cid} onChange={e=>setCid(e.target.value)}>
          {db.centres.map(x=><option key={x.id} value={x.id}>{x.name}</option>)}
        </select>
      </div>
      <div className="board">
        <div style={{position:"relative",zIndex:1}}>
          <div className="board-label"><span className="pulse"/> {t("nowServing")} · {fmtDate(date,lang)}</div>
          <div className="board-num">{serving?serving.token:"— — —"}</div>
          <div className="board-mini" style={{marginTop:14}}>
            <div><b>{q.length}</b><span>{t("waiting")}</span></div>
            <div><b>{c?c.svcMin:0}</b><span>{t("minutes")} / {t("quantity")}</span></div>
          </div>
        </div>
      </div>
      {active && active.centreId===cid ? (
        <div className="card">
          {isCalled && <div className="notice" style={{marginBottom:12,fontWeight:600}}>{t("called")}</div>}
          <div className="slip">
            <div className="between">
              <div><div className="tiny muted">{t("yourToken")}</div><div className="tok">{active.token}</div></div>
              <div style={{textAlign:"right"}}>
                <div className="tiny muted">{t("aheadOfYou")}</div>
                <b className="mono" style={{fontSize:30}}>{pos>=0?pos:0}</b>
              </div>
            </div>
            <hr className="sep"/>
            <div className="kv"><span className="muted">{t("estWait")}</span><b className="mono">{pos>=0&&c?pos*c.svcMin:0} {t("minutes")}</b></div>
            <div className="kv"><span className="muted">{t("arriveBy")}</span><b className="mono">{active.slot.split("–")[0]}</b></div>
          </div>
          <button className="btn danger sm" style={{marginTop:12}} onClick={cancelBooking}>{t("cancelBooking")}</button>
        </div>
      ) : <div className="card"><p className="muted small" style={{margin:0}}>{t("noBooking")}</p></div>}
      <div className="card">
        <h4 style={{marginBottom:10}}>{t("qmgmt")}</h4>
        {q.length===0 ? <p className="muted small" style={{margin:0}}>{t("queueEmpty")}</p> :
          <div className="tablewrap"><table>
            <thead><tr><th>#</th><th>{t("token")}</th><th>{t("time")}</th><th>{t("status")}</th></tr></thead>

function AdminAuth({db,setDB,t,onLogin,go}){
  const [u,setU] = useState("officer"), [p,setP] = useState(""), [err,setErr] = useState(""), [busy,setBusy] = useState(false);
  async function submit(){
    setErr(""); setBusy(true);
    let admin = db.admin;
    if(!admin){
      const {salt,hash} = await hashPin("1234");
      admin = {username:"officer", pinSalt:salt, pinHash:hash};
      setDB(d=>({...d, admin}));
    }
    if(u.trim().toLowerCase() !== admin.username){ setBusy(false); return setErr(t("errNoUser")); }
    const ok = await verifyPin(p, admin.pinSalt, admin.pinHash);
    setBusy(false);
    if(!ok) return setErr(t("errWrong"));
    onLogin();
  }
  return (
    <div className="narrow" style={{paddingTop:26,maxWidth:440}}>
      <button className="btn ghost sm" onClick={()=>go("landing")}>← {t("back")}</button>
      <div className="card" style={{marginTop:14}}>
        <h2>{t("adminLogin")}</h2>
        <p className="small muted">{t("adminHint")}</p>
        <hr className="sep"/>
        <label className="field"><span>{t("username")}</span>
          <input className="input mono" value={u} onChange={e=>setU(e.target.value)}/></label>
        <label className="field"><span>{t("pin")}</span>
          <input className="input mono" type="password" inputMode="numeric" maxLength={4} value={p}
            onChange={e=>setP(e.target.value.replace(/\D/g,""))} onKeyDown={e=>e.key==="Enter"&&submit()}/></label>
        {err && <div className="notice small" style={{marginBottom:12,borderColor:"var(--bad)",background:"var(--bad-soft)",color:"var(--bad)"}}>{err}</div>}
        <button className="btn block" disabled={busy} onClick={submit}>{busy?"…":t("login")}</button>
      </div>
    </div>
  );
}

function AdminQueue({db,setDB,t,lang,cid,date,toast}){
  const c = centreById(db,cid);
  const q = queueFor(db,cid,date);
  const serving = servingToken(db,cid,date);

  function callNext(){
    const list = queueFor(db,cid,date);
    if(list.length===0) return toast(t("queueEmpty"));
    const cur = servingToken(db,cid,date);
    let next = list[0];
    if(cur){ const i = list.findIndex(b=>b.id===cur.id); next = list[i+1] || null; }
    if(!next) return toast(t("queueEmpty"));
    setDB(d=>{
      const n = {...d, serving:{...d.serving}, notes:[...d.notes]};
      n.serving[cid+"|"+date] = {id:next.id, token:next.token};
      const tf = makeT((farmerById(d,next.farmerId)||{}).lang || "en");
      pushNote(n, next.farmerId, tf("msgCalled",{k:next.token,c:c.name}), "push");
      const ahead = queueFor(d,cid,date);
      const idx = ahead.findIndex(b=>b.id===next.id);
      const soon = ahead[idx+3];
      if(soon){
        const ts = makeT((farmerById(d,soon.farmerId)||{}).lang || "en");
        pushNote(n, soon.farmerId, ts("msgNear",{k:soon.token,c:c.name}), "sms");
      }
      return n;
    });
    toast(t("nowCalling")+" "+next.token);
  }
  const setStatus = (id,status) => setDB(d=>({...d, bookings:d.bookings.map(b=>b.id===id?{...b,status}:b)}));

  return (
    <div className="stack">
      <div className="between">
        <h2>{t("qmgmt")} — {fmtDate(date,lang)}</h2>
        <button className="btn warn" onClick={callNext}>{t("callNext")}</button>
      </div>
      {serving && <div className="card tight"><span className="tag info">{t("nowCalling")}</span>
        <b className="mono" style={{fontSize:22,marginLeft:10}}>{serving.token}</b></div>}
      {q.length===0 ? <div className="card"><p className="muted" style={{margin:0}}>{t("queueEmpty")}</p></div> :
        <div className="tablewrap"><table>
          <thead><tr><th>#</th><th>{t("token")}</th><th>{t("name")}</th><th>{t("time")}</th><th>{t("quantity")}</th><th>{t("estWait")}</th><th></th></tr></thead>
          <tbody>{q.map((b,i)=>{
            const f = farmerById(db,b.farmerId) || {};
            return (
              <tr key={b.id} style={serving&&serving.id===b.id?{background:"var(--turmeric-soft)"}:null}>
                <td className="mono">{i+1}</td>
                <td className="mono"><b>{b.token}</b></td>
                <td>{f.name}<div className="tiny muted">{f.village}</div></td>
                <td className="mono small">{b.slot}</td>
                <td className="mono">{b.expQty} {t("quintals")}</td>
                <td className="mono small">{i*(c?c.svcMin:0)} {t("minutes")}</td>
                <td><div className="row" style={{gap:6,flexWrap:"nowrap"}}>
                  {b.status==="booked" && <button className="btn ghost sm" onClick={()=>setStatus(b.id,"arrived")}>{t("markArrived")}</button>}
                  <button className="btn danger sm" onClick={()=>setStatus(b.id,"noshow")}>{t("markNoShow")}</button>
                </div></td>
              </tr>);
          })}</tbody></table></div>}
    </div>
  );
}

function AdminWeigh({db,setDB,t,lang,cid,date,toast}){
  const c = centreById(db,cid);
  const pending = db.bookings.filter(b=>b.centreId===cid && ACTIVE.includes(b.status));
  const weighed = db.bookings.filter(b=>b.centreId===cid && ["weighed","accepted"].includes(b.status));
  const [sel,setSel] = useState(null);
  const [form,setForm] = useState({qty:"",moisture:"14",grade:"A",rate:""});

  function open(b){ setSel(b); setForm({qty:String(b.expQty||""),moisture:"14",grade:"A",rate:String(b.rate||c.rate)}); }
  function save(){
    const qty = Number(form.qty), rate = Number(form.rate);
    if(!qty||!rate) return toast(t("errQty"));
    const amount = Math.round(qty*rate);
    setDB(d=>{
      const n = {...d, bookings:d.bookings.map(b=>b.id===sel.id?{...b,status:"weighed",qty,moisture:form.moisture,grade:form.grade,rate,amount,weighedAt:Date.now()}:b), notes:[...d.notes]};
      const tf = makeT((farmerById(d,sel.farmerId)||{}).lang||"en");
      pushNote(n, sel.farmerId, tf("msgWeighed",{k:sel.token,q:qty,r:rate,a:amount.toLocaleString("en-IN")}), "sms");
      return n;
    });
    setSel(null); toast(t("updated"));
  }
  function accept(b){
    setDB(d=>{
      const centres = d.centres.map(x=>x.id===b.centreId?{...x, storageUsed:Math.min(x.storageCap, x.storageUsed+(b.qty||0))}:x);
      const n = {...d, centres, bookings:d.bookings.map(x=>x.id===b.id?{...x,status:"accepted"}:x), notes:[...d.notes]};
      const nc = centres.find(x=>x.id===b.centreId);
      if(storagePct(nc)>90){
        d.farmers.forEach(f=>{
          const tf = makeT(f.lang||"en");
          pushNote(n, f.id, tf("msgStorage",{c:nc.name,p:storagePct(nc)}), "sms");
        });
      }
      return n;
    });
    toast(t("updated"));
  }
  function pay(b){
    const utr = "UTR" + randHex(5).toUpperCase();
    setDB(d=>{
      const n = {...d, bookings:d.bookings.map(x=>x.id===b.id?{...x,status:"paid",utr,paidAt:Date.now()}:x), notes:[...d.notes]};
      const tf = makeT((farmerById(d,b.farmerId)||{}).lang||"en");
      pushNote(n, b.farmerId, tf("msgPaid",{k:b.token,a:(b.amount||0).toLocaleString("en-IN"),u:utr}), "sms");
      return n;
    });
    toast(t("updated"));
  }

  return (
    <div className="stack">
      <h2>{t("recordWeighing")}</h2>
      <div className="card">
        <h4 style={{marginBottom:10}}>{t("qmgmt")}</h4>
        {pending.length===0 ? <p className="muted small" style={{margin:0}}>{t("queueEmpty")}</p> :
          <div className="tablewrap"><table>
            <thead><tr><th>{t("token")}</th><th>{t("name")}</th><th>{t("quantity")}</th><th></th></tr></thead>
            <tbody>{pending.map(b=>{
              const f = farmerById(db,b.farmerId)||{};
              return <tr key={b.id}><td className="mono">{b.token}</td><td>{f.name}</td>
                <td className="mono">{b.expQty} {t("quintals")}</td>
                <td><button className="btn sm" onClick={()=>open(b)}>{t("recordWeighing")}</button></td></tr>;
            })}</tbody></table></div>}
      </div>

      {sel && <div className="card" style={{borderColor:"var(--green)"}}>
        <div className="between"><h4>{t("recordWeighing")} — <span className="mono">{sel.token}</span></h4>
          <button className="icon-btn" onClick={()=>setSel(null)} aria-label={t("close")}>✕</button></div>
        <div className="grid g2" style={{marginTop:12}}>
          <label className="field"><span>{t("netQty")}</span>
            <input className="input mono" inputMode="decimal" value={form.qty} onChange={e=>setForm({...form,qty:e.target.value.replace(/[^\d.]/g,"")})}/></label>
          <label className="field"><span>{t("moisturePct")}</span>
            <input className="input mono" inputMode="decimal" value={form.moisture} onChange={e=>setForm({...form,moisture:e.target.value.replace(/[^\d.]/g,"")})}/></label>
          <label className="field"><span>{t("grade")}</span>
            <select className="input" value={form.grade} onChange={e=>setForm({...form,grade:e.target.value})}>
              <option>A</option><option>B</option><option>C</option></select></label>
          <label className="field"><span>{t("ratePerQ")}</span>
            <input className="input mono" inputMode="decimal" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value.replace(/[^\d.]/g,"")})}/></label>
        </div>
        <div className="sunk between" style={{marginBottom:12}}>
          <span className="muted small">{t("payable")}</span>
          <b className="mono" style={{fontSize:22}}>{inr(Number(form.qty||0)*Number(form.rate||0))}</b>
        </div>
        <button className="btn" onClick={save}>{t("save")}</button>
      </div>}

      <div className="card">
        <h4 style={{marginBottom:10}}>{t("pendingPayments")}</h4>
        {weighed.length===0 ? <p className="muted small" style={{margin:0}}>{t("noPending")}</p> :
          <div className="tablewrap"><table>
            <thead><tr><th>{t("token")}</th><th>{t("name")}</th><th>{t("quantity")}</th><th>{t("grade")}</th><th>{t("amount")}</th><th>{t("status")}</th><th></th></tr></thead>
            <tbody>{weighed.map(b=>{
              const f = farmerById(db,b.farmerId)||{};
              return <tr key={b.id}>
                <td className="mono">{b.token}</td><td>{f.name}</td>
                <td className="mono">{b.qty} {t("quintals")}</td><td className="mono">{b.grade}</td>
                <td className="mono"><b>{inr(b.amount)}</b></td>
                <td><StatusChip status={b.status} t={t}/></td>
                <td>{b.status==="weighed"
                  ? <button className="btn ghost sm" onClick={()=>accept(b)}>{t("accept")}</button>
                  : <button className="btn sm" onClick={()=>pay(b)}>{t("markPaid")}</button>}</td>
              </tr>;
            })}</tbody></table></div>}
      </div>
    </div>
  );
}

          <label className="field"><span>{t("crop")}</span>

              <option>Paddy</option><option>Wheat</option><option>Ragi</option><option>Maize</option><option>Jowar</option></select></label>

function AdminFarmers({db,t}){
  const [qs,setQs] = useState("");
  const [open,setOpen] = useState(null);
  const [plain,setPlain] = useState({});
  useEffect(()=>{ let alive=true;
    if(open){ const f = farmerById(db,open);
      (async()=>{ const p={phone:await decField(f.phoneEnc),aadhaar:await decField(f.aadhaarEnc),bank:await decField(f.bankEnc)};
        if(alive) setPlain(p); })();
    } else setPlain({});
    return ()=>{alive=false;};
  },[open]);
  const list = db.farmers.filter(f=>{
    const s = qs.trim().toLowerCase();
    if(!s) return true;
    return (f.name+" "+f.village+" "+f.crop).toLowerCase().includes(s);
  });
  return (
    <div className="stack">
      <div className="between"><h2>{t("farmers")}</h2>
        <input className="input" style={{maxWidth:280}} placeholder={t("searchFarmer")} value={qs} onChange={e=>setQs(e.target.value)}/></div>

        <div className="tablewrap"><table>
          <thead><tr><th>{t("name")}</th><th>{t("village")}</th><th>{t("crop")}</th><th>{t("phone")}</th><th>{t("aadhaar")}</th><th>{t("bank")}</th><th></th></tr></thead>
          <tbody>{list.map(f=>(
            <tr key={f.id}>
              <td><b>{f.name}</b></td><td>{f.village||"—"}</td><td>{f.crop}</td>
              <td className="mono small">{open===f.id?(plain.phone||"…"):f.phoneMask}</td>
              <td className="mono small">{open===f.id?(plain.aadhaar||"…"):(f.aadhaarMask||"—")}</td>
              <td className="mono small">{open===f.id?(plain.bank||"…"):(f.bankMask||"—")}</td>
              <td><button className="btn ghost sm" onClick={()=>setOpen(open===f.id?null:f.id)}>{open===f.id?t("encHide"):t("encReveal")}</button></td>
            </tr>))}

      {open && <div className="card flat" style={{background:"var(--surface-2)"}}>
        <div className="tiny muted" style={{marginBottom:4}}>{t("encStored")}</div>
        <div className="cipher">{(farmerById(db,open)||{}).aadhaarEnc || "—"}</div>
      </div>}
    </div>
  );
}

function AdminBroadcast({db,setDB,t,toast}){
  const [target,setTarget] = useState("all");
  const [msg,setMsg] = useState("");
  function send(){
    if(!msg.trim()) return toast(t("errMsg"));
    const ids = target==="all" ? db.farmers.map(f=>f.id)
      : Array.from(new Set(db.bookings.filter(b=>b.centreId===target && b.status!=="cancelled").map(b=>b.farmerId)));
    setDB(d=>{ const n={...d,notes:[...d.notes]}; ids.forEach(id=>pushNote(n,id,msg.trim(),"sms")); return n; });
    toast(t("sentTo")+" "+ids.length+" "+t("peopleShort"));
    setMsg("");
  }
  const recent = db.notes.slice(0,8);
  return (
    <div className="stack">
      <h2>{t("msgTitle")}</h2>
      <div className="card">
        <label className="field"><span>{t("sendTo")}</span>
          <select className="input" value={target} onChange={e=>setTarget(e.target.value)}>
            <option value="all">{t("allFarmers")}</option>
            {db.centres.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
          </select></label>
        <label className="field"><span>{t("msgBody")}</span>
          <textarea className="input" rows={3} value={msg} onChange={e=>setMsg(e.target.value)}
            placeholder="Procurement at Hassan APMC starts at 07:00 tomorrow."/></label>
        <div className="sunk" style={{marginBottom:12}}>
          <div className="tiny muted" style={{marginBottom:5}}>{t("smsPreview")}</div>
          <div className="small">{msg.trim() || "—"}</div>
        </div>
        <button className="btn" onClick={send}>{t("send")}</button>
      </div>
      <div className="card">
        <h4 style={{marginBottom:10}}>{t("alerts")}</h4>
        {recent.length===0 ? <p className="muted small" style={{margin:0}}>{t("noAlerts")}</p> :
          <div className="stack">{recent.map(n=>{
            const f = farmerById(db,n.farmerId);
            return <div className="sms" key={n.id}>
              <div className="between tiny muted" style={{marginBottom:4}}>
                <span>{f?f.name:"—"} · {n.channel==="sms"?t("sms"):t("push")}</span>
                <span>{new Date(n.ts).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</span>
              </div>
              <div className="small">{n.text}</div></div>;
          })}</div>}
      </div>
    </div>
  );
}

}

const DEMO_PEOPLE = [
  ["Ramesh Gowda","Channarayapatna","Paddy","kn",4.5,"9845012301","512345678901","31002345671"],
  ["Lakshmamma B","Arsikere","Paddy","kn",2,"9845012302","512345678902","31002345672"],

  ["Sharada Patil","Alur","Paddy","mr",5,"9845012305","512345678905","31002345675"],
  ["Mahesh Shetty","Sakleshpur","Paddy","kn",6.4,"9845012306","512345678906","31002345676"],
  ["Anil Yadav","Mandya Town","Paddy","hi",2.8,"9845012307","512345678907","31002345677"],
  ["Girija Bai","Maddur","Paddy","kn",3.6,"9845012308","512345678908","31002345678"]
];
async function buildDemo(base){
  const db = {...base, farmers:[], bookings:[], notes:[], complaints:[], serving:{}, seq:{}};
  const {salt,hash} = await hashPin("1111");
  for(const [name,village,crop,lg,acres,phone,aadhaar,bank] of DEMO_PEOPLE){
    db.farmers.push({
      id:uid("f"), name, village, crop, acres, lang:lg,
      phoneEnc:await encField(phone), phoneMask:maskTail(phone,4),
      aadhaarEnc:await encField(aadhaar), aadhaarMask:maskTail(aadhaar,4),
      bankEnc:await encField(bank), bankMask:maskTail(bank,4),
      pinSalt:salt, pinHash:hash, createdAt:Date.now()
    });
  }
  const date = todayISO(), dd = date.slice(8,10)+date.slice(5,7);
  const plan = [
    [0,"c1","08:00–10:00",42,"paid"], [1,"c1","08:00–10:00",18,"accepted"],
    [2,"c1","10:00–12:00",65,"weighed"], [3,"c1","10:00–12:00",24,"arrived"],
    [4,"c1","10:00–12:00",31,"booked"], [5,"c1","12:00–14:00",48,"booked"],
    [6,"c3","08:00–10:00",27,"booked"], [7,"c3","10:00–12:00",39,"booked"]
  ];
  plan.forEach(([fi,cid,slot,qty,status])=>{
    const c = db.centres.find(x=>x.id===cid);
    const key = cid+"|"+date;
    const seq = (db.seq[key]||0)+1; db.seq[key]=seq;
    const token = c.code+"-"+dd+"-"+String(seq).padStart(3,"0");
    const f = db.farmers[fi];
    const b = {id:uid("b"), farmerId:f.id, centreId:cid, date, slot, seq, token, status,
      expQty:qty, rate:c.rate, createdAt:Date.now()-((8-fi)*3600000)};
    if(["weighed","accepted","paid"].includes(status)){
      b.qty = qty; b.moisture = "13.5"; b.grade = "A";
      b.amount = Math.round(qty*c.rate); b.weighedAt = Date.now()-7200000;
      const tf = makeT(f.lang);
      pushNote(db, f.id, tf("msgWeighed",{k:token,q:qty,r:c.rate,a:b.amount.toLocaleString("en-IN")}), "sms");
    }
    if(status==="paid"){
      b.utr = "UTR" + randHex(5).toUpperCase(); b.paidAt = Date.now()-3600000;
      pushNote(db, f.id, makeT(f.lang)("msgPaid",{k:token,a:b.amount.toLocaleString("en-IN"),u:b.utr}), "sms");
    }
    pushNote(db, f.id, makeT(f.lang)("msgBooked",{c:c.name,d:fmtDate(date,f.lang),t:slot,k:token}), "sms");
    db.bookings.push(b);
  });
  const first = db.bookings.find(b=>b.status==="arrived");
  if(first) db.serving["c1|"+date] = {id:first.id, token:first.token};
  const ad = await hashPin("1234");
  db.admin = {username:"officer", pinSalt:ad.salt, pinHash:ad.hash};
  db.demoSeeded = true;
  return db;
}

/* ============================================================
   12. ROOT
   ============================================================ */
function App(){
  const [ready,setReady] = useState(false);
  const [lang,setLang] = useState(()=>{ try{ return localStorage.getItem("as.lang")||"en"; }catch(e){ return "en"; } });
  const [theme,setTheme] = useState(()=>{ try{ return localStorage.getItem("as.theme")||""; }catch(e){ return ""; } });
  const [db,setDBraw] = useState(loadDB);
  const [view,setView] = useState("landing");
  const [meId,setMeId] = useState(null);
  const [adminOk,setAdminOk] = useState(false);
  const [msg,setMsg] = useState("");
  const t = useMemo(()=>makeT(lang),[lang]);

  const setDB = useCallback(updater=>{
    setDBraw(prev=>{ const next = typeof updater==="function"?updater(prev):updater; saveDB(next); return next; });
  },[]);
  const toast = useCallback(m=>{ setMsg(m); setTimeout(()=>setMsg(""),2600); },[]);

  useEffect(()=>{
    initKey().then(async ()=>{
      const cur = loadDB();
      if(!cur.demoSeeded){
        try{ const fresh = await buildDemo(seed()); setDB(fresh); }catch(e){}
      }
      setReady(true);
    }).catch(()=>setReady(true));
  },[]);
  useEffect(()=>{ try{ localStorage.setItem("as.lang",lang); }catch(e){} document.documentElement.lang = lang; },[lang]);
  useEffect(()=>{
    if(theme) document.documentElement.setAttribute("data-theme",theme);
    else document.documentElement.removeAttribute("data-theme");
    try{ localStorage.setItem("as.theme",theme); }catch(e){}
  },[theme]);
  useEffect(()=>{ document.title = t("app")+" — "+t("tagline"); },[lang]);

  const me = meId ? farmerById(db,meId) : null;
  const effTheme = theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark":"light");

  async function reset(){
    try{ localStorage.removeItem(DB_KEY); }catch(e){}
    setMeId(null); setAdminOk(false); setView("landing");
    try{ setDB(await buildDemo(seed())); }catch(e){ setDB(seed()); }
    toast(t("resetDone"));
  }
  function logout(){ setMeId(null); setAdminOk(false); setView("landing"); }

  if(!ready) return <div className="wrap" style={{padding:40}}><p className="muted">…</p></div>;

  return (
    <>
      <header className="topbar">
        <div className="topbar-in">
          <div className="brand" onClick={()=>{ if(!meId&&!adminOk) setView("landing"); }} style={{cursor:"pointer"}}>
            <span className="seal" aria-hidden="true">✦</span>
            <span>{t("app")}<small>{t("tagline")}</small></span>
          </div>
          <div className="row" style={{gap:8}}>
            <LangPicker lang={lang} setLang={setLang}/>
            <ThemeToggle theme={effTheme} setTheme={setTheme} t={t}/>
            {(meId||adminOk) && <button className="btn ghost sm" onClick={logout}>{t("logout")}</button>}
          </div>
        </div>
      </header>

      {view==="landing" && <Landing db={db} t={t} lang={lang} go={setView}/>}
      {view==="farmer" && !me && <FarmerAuth db={db} setDB={setDB} t={t} lang={lang} setLang={setLang} go={setView}
        onLogin={id=>{ setMeId(id); }}/>}
      {view==="farmer" && me && <FarmerApp db={db} setDB={setDB} t={t} lang={lang} me={me} toast={toast}/>}
      {view==="admin" && !adminOk && <AdminAuth db={db} setDB={setDB} t={t} go={setView} onLogin={()=>setAdminOk(true)}/>}
      {view==="admin" && adminOk && <AdminApp db={db} setDB={setDB} t={t} lang={lang} toast={toast}/>}

      <Toast msg={msg}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
